name: Guarded Production Database Restore
run-name: Database restore ${{ inputs.restore_job_id }}

on:
  workflow_dispatch:
    inputs:
      restore_job_id:
        description: Fresh authorized restore job UUID
        required: true
        type: string
      backup_id:
        description: Selected encrypted backup UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenth-west-production-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      DB_SSL_MODE: no-verify
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_STORAGE_BUCKET: database-backups
      BACKUP_RETENTION_DAYS: '14'
      BACKUP_ENABLED: 'true'
      BACKUP_CRON: '0 2 * * *'
      BACKUP_TIMEZONE: Asia/Manila
      RESTORE_JOB_ID: ${{ inputs.restore_job_id }}
      RESTORE_BACKUP_ID: ${{ inputs.backup_id }}
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check required configuration
        shell: bash
        run: |
          for name in DATABASE_URL BACKUP_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is missing."; exit 1; fi
          done
      - name: Build recovery worker
        id: image
        run: docker build -t tenth-west-database-restore ./backend
      - name: Restore through guarded worker
        run: |
          docker run --rm \
            -e NODE_ENV -e DATABASE_URL -e BACKUP_DATABASE_URL -e DB_SSL_MODE \
            -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY -e BACKUP_ENCRYPTION_KEY \
            -e BACKUP_STORAGE_BUCKET -e BACKUP_RETENTION_DAYS -e BACKUP_ENABLED \
            -e BACKUP_CRON -e BACKUP_TIMEZONE -e RESTORE_JOB_ID -e RESTORE_BACKUP_ID \
            -e GITHUB_ACTIONS tenth-west-database-restore node scripts/restore-database.js
      - name: Record interrupted workflow safely
        if: ${{ always() && steps.image.outcome == 'success' }}
        run: |
          docker run --rm \
            -e NODE_ENV -e DATABASE_URL -e BACKUP_DATABASE_URL -e DB_SSL_MODE \
            -e RESTORE_JOB_ID -e RESTORE_BACKUP_ID -e GITHUB_ACTIONS \
            tenth-west-database-restore node scripts/restore-database.js --finalize
